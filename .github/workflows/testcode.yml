name: Run Tests on Pull Request

on:
  pull_request:
    branches:
      - Weekly

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set environment variables for database
        run: |
          echo "spring.datasource.url=${{ secrets.MYSQL_URL }}" >> $GITHUB_ENV
          echo "spring.datasource.username=${{ secrets.MYSQL_USERNAME }}" >> $GITHUB_ENV
          echo "spring.datasource.password=${{ secrets.MYSQL_PASSWORD }}" >> $GITHUB_ENV
          echo "spring.jpa.hibernate.ddl-auto=create" >> $GITHUB_ENV

      - name: Wait for MySQL to be ready
        run: |
          wget https://github.com/vishnubob/wait-for-it/releases/download/v2.2.3/wait-for-it.sh
          chmod +x wait-for-it.sh
          ./wait-for-it.sh localhost:3306 --timeout=60 --strict -- echo "MySQL is ready!"

      - name: Run Tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./gradlew test
